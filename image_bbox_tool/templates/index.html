<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📷 图像标注工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
            background: #f5f5f5;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .controls {
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
            margin-right: 10px;
        }
        input[type="text"], input[type="file"] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 10px 16px;
            margin: 0 5px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #2980b9;
        }
        #canvas-container {
            display: block;
            max-width: 100%;
            overflow: auto;
            text-align: center;
            margin-top: 10px;
        }
        canvas {
            border: 2px dashed #3498db;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            background: #f9f9f9;
        }
        #json-output {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>
<body>
    <h1>📷 图像标注工具</h1>

    <div class="controls">
        <input type="file" id="imageUpload" accept="image/*" />
        <label>标签: <input type="text" id="labelInput" value="object" /></label>
        <button onclick="exportJSON()">💾 导出 JSON</button>
        <button onclick="clearAll()">🗑️ 清空所有框</button>
    </div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <pre id="json-output"></pre>

    <script src="/static/script.js"></script>
</body>
</html>
